name: Release

# Runs for every new version tag (v1.2.3) that points at a commit on main/master.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the tag to be on main/master
        run: |
          for branch in main master; do
            if git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch" 2>/dev/null; then exit 0; fi
          done
          echo "::error::tag $GITHUB_REF_NAME is not on main/master"
          exit 1
      - uses: extractions/setup-just@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv run playwright install --with-deps chromium
      - uses: browser-actions/setup-firefox@v1
      - uses: browser-actions/setup-geckodriver@latest
      - run: just check-version "$GITHUB_REF_NAME"
      - run: just ci
      - run: just package
      - name: Publish Firefox extension to AMO
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext@8 sign \
            --source-dir extension \
            --artifacts-dir dist \
            --channel listed \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" \
            --approval-timeout 0 \
            --no-input
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
